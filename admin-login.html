<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Puzzle Grove</title>
    <script>(function(){try{if(localStorage.getItem('puzzleGroveTheme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css">
    <style>
        .form-floating { margin-bottom: var(--space-4); }
        .back-link { text-align: center; margin-top: var(--space-5); }
        .back-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .back-link a:hover { color: var(--accent-hover); text-decoration: underline; }
        .security-note { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-4); font-size: var(--text-sm); color: var(--secondary-text); }
        .security-note i { color: var(--accent); margin-right: var(--space-2); }
    </style>
</head>
<body>
    <div id="layout-header-slot"></div>
    <main id="layout-main">
    <div class="container">
    <div class="admin-login-container card">
        <header class="page-header page-header--centered">
            <div class="page-header__inner">
                <div class="page-header__content">
                    <h1 class="page-header__title"><i class="fas fa-shield-alt"></i> Admin Access</h1>
                    <p class="page-header__subtitle">Enter admin credentials to access the database panel</p>
                </div>
            </div>
        </header>

        <div class="security-note">
            <i class="fas fa-lock"></i>
            <strong>Security Notice:</strong> This area is restricted to authorized administrators only.
        </div>

        <form id="adminLoginForm">
            <div class="form-floating form-group">
                <label for="adminUsername">Admin Username</label>
                <input type="text" class="input form-control" id="adminUsername" placeholder="Admin Username" required>
            </div>

            <div class="form-floating form-group">
                <label for="adminPassword">Admin Password</label>
                <input type="password" class="input form-control" id="adminPassword" placeholder="Admin Password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Access Admin Panel
            </button>
        </form>

        <div class="back-link">
            <a href="index.html">
                <i class="fas fa-arrow-left"></i> Back to Puzzle Grove
            </a>
        </div>

        <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
        <div id="successMessage" class="alert alert-success" style="display: none;"></div>
    </div>
    </div>
    </main>
    <div id="layout-footer-slot"></div>

    <script src="database.js"></script>
    <script src="theme-toggle.js"></script>
    <script src="layout/layout.js"></script>
    <script src="layout/layout-auth.js"></script>
    <script>
        class AdminLoginManager {
            constructor() {
                // Admin credentials (in production, these should be server-side)
                this.adminCredentials = {
                    username: 'admin',
                    password: 'puzzlegrove2024'
                };
                this.init();
            }

            init() {
                const form = document.getElementById('adminLoginForm');
                form.addEventListener('submit', (e) => {
                    this.handleLogin(e);
                });

                // Real-time validation
                document.getElementById('adminUsername').addEventListener('blur', () => {
                    this.validateUsername();
                });

                document.getElementById('adminPassword').addEventListener('blur', () => {
                    this.validatePassword();
                });
            }

            handleLogin(e) {
                e.preventDefault();
                
                const username = document.getElementById('adminUsername').value.trim();
                const password = document.getElementById('adminPassword').value;
                
                this.clearMessages();
                
                // Validate form
                if (!this.validateForm()) {
                    return;
                }
                
                // Check admin credentials
                if (username === this.adminCredentials.username && password === this.adminCredentials.password) {
                    this.loginSuccess();
                } else {
                    this.showError('Invalid admin credentials. Access denied.');
                }
            }

            validateForm() {
                const username = document.getElementById('adminUsername');
                const password = document.getElementById('adminPassword');
                let isValid = true;

                if (!this.validateUsername()) {
                    isValid = false;
                }

                if (!this.validatePassword()) {
                    isValid = false;
                }

                return isValid;
            }

            validateUsername() {
                const username = document.getElementById('adminUsername');
                const value = username.value.trim();
                
                if (value.length === 0) {
                    username.classList.remove('is-valid');
                    username.classList.add('is-invalid');
                    return false;
                } else {
                    username.classList.remove('is-invalid');
                    username.classList.add('is-valid');
                    return true;
                }
            }

            validatePassword() {
                const password = document.getElementById('adminPassword');
                const value = password.value;
                
                if (value.length === 0) {
                    password.classList.remove('is-valid');
                    password.classList.add('is-invalid');
                    return false;
                } else {
                    password.classList.remove('is-invalid');
                    password.classList.add('is-valid');
                    return true;
                }
            }

            loginSuccess() {
                // Create admin session
                const adminSession = {
                    isAdmin: true,
                    username: 'admin',
                    loginTime: new Date().toISOString(),
                    sessionId: 'admin_' + Date.now()
                };
                
                // Store admin session
                sessionStorage.setItem('puzzleGroveAdmin', JSON.stringify(adminSession));
                
                // Show success message
                this.showSuccess('Admin access granted. Redirecting...');
                
                // Redirect to admin panel
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1500);
            }

            showError(message) {
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                
                // Hide after 5 seconds
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 5000);
            }

            showSuccess(message) {
                const successDiv = document.getElementById('successMessage');
                successDiv.textContent = message;
                successDiv.style.display = 'block';
            }

            clearMessages() {
                document.getElementById('errorMessage').style.display = 'none';
                document.getElementById('successMessage').style.display = 'none';
            }
        }

        // Initialize admin login manager
        new AdminLoginManager();
    </script>
</body>
</html>
